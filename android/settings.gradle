pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }

        def localFlutterSdkPath = properties.getProperty("flutter.sdk")
        def environmentFlutterSdkPath = System.getenv("FLUTTER_ROOT")
        // The Nix shell exports FLUTTER_ROOT. Prefer it so an old local
        // Flutter installation cannot override the pinned SDK.
        def flutterSdkPath = [environmentFlutterSdkPath, localFlutterSdkPath]
            .find { path -> path != null && file(path).isDirectory() }

        if (flutterSdkPath == null) {
            throw new GradleException(
                "Flutter SDK not found. Run Flutter from the project or set FLUTTER_ROOT."
            )
        }

        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "7.3.0" apply false
}

include ":app"
