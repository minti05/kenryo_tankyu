<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>縣陵探究アーカイブ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f5;
      color: #333;
      text-align: center;
      padding: 32px 24px;
    }
    .logo {
      width: 150px;
      height: 150px;
      border-radius: 22px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: #000;
      color: #fff;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
    }
    .open-btn {
      display: inline-block;
      background: #1a73e8;
      color: #fff;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 16px;
      cursor: pointer;
      border: none;
      width: 100%;
      max-width: 280px;
    }
    .divider {
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <img class="logo" src="/icon.png" alt="縣陵探究アーカイブ" />
  <h1>縣陵探究アーカイブ</h1>
  <p>
    長野県松本県ヶ丘高等学校の<br />
    探究活動アーカイブアプリです。
  </p>
  <div class="btn-wrap">
    <button class="open-btn" onclick="openInApp()">アプリで開く</button>
    <div class="divider">アプリが入っていない場合</div>
    <a class="btn" href="https://apps.apple.com/jp/app/%E7%B8%A3%E9%99%B5%E6%8E%A2%E7%A9%B6%E3%82%A2%E3%83%BC%E3%82%AB%E3%82%A4%E3%83%96/id6738385612">
      App Store でダウンロード
    </a>
  </div>
  <script>
    function openInApp() {
      const path = window.location.pathname;
      const scheme = "kenryotankyu:/" + path;
      // iframeで試みることでページから離脱せずにアプリを起動する
      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = scheme;
      document.body.appendChild(iframe);
      setTimeout(function () {
        document.body.removeChild(iframe);
      }, 2000);
    }
    // ページ読み込み時に自動でアプリ起動を試みる
    window.addEventListener("load", function () {
      openInApp();
    });
  </script>
</body>
</html>
